name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    name: Estilo, pruebas y verificación
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Instalar herramientas de desarrollo
        run: npm install --no-audit --no-fund
      - name: Estilo (ESLint)
        run: npm run lint
      - name: Pruebas con valores conocidos y cobertura
        run: npm run coverage 2>&1 | tee cobertura.txt
      - name: Verificación con 30 sujetos simulados por prueba
        run: npm run validate | tee validacion.md
      - name: Ejemplo de uso del motor desde Node
        run: npm run example
      - name: Resumen
        run: |
          echo '## Cobertura del motor' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E 'file|metrics.js|synth.js|replay.js|all files' cobertura.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat validacion.md >> "$GITHUB_STEP_SUMMARY"

  app:
    name: App completa en Chromium (vídeo real)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Instalar dependencias y Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Analizar el vídeo de ejemplo, revisar, comparar y generar el PDF
        run: npm run e2e | tee e2e.txt
      - name: Resumen
        run: |
          echo '## App completa en Chromium' >> "$GITHUB_STEP_SUMMARY"
          cat e2e.txt >> "$GITHUB_STEP_SUMMARY"
